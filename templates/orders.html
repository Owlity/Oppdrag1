    {% extends "base.html" %}
    {% block content %}
    <label>hva vil du bestille?</label>
    <form action="/order" method="POST">
        <select name="items" id="items">
            {% for items in itemliste %}
            <option value="{{ items }}">{{ items }}</option>
            {% endfor %}
        </select>
        <p>hvordan vil du betale?</p>
        <input type="radio" name="produkt" value="med kort" id="produkt"> kort
        <input type="radio" name="produkt" value="med giftcard"> giftcard
        <input type="radio" name="produkt" value="fysisk"> fysisk
        <label>Navn</label>
        <input type="text" name="navn">
        <label>E-mail</label>
        <input type="email" name="email">
        <label>Personnummer</label>
        <input type="number" name="pnummer">
        <button type="submit">Send</button>    
            
    </form>
    {% endblock %}
